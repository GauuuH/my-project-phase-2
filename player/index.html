<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DECIDER · Player</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/player.css">
</head>
<body>

  <main class="phone">
    <h1>DECIDER</h1>
    <p class="sub">Phone player</p>

    <section class="join" id="joinSection">
      <h2>1 · Choose your role</h2>
      <div class="role-grid" id="roleGrid"></div>
      <p class="hint">Roles marked <b>1/1</b> already have a player in the room — pick a free one.</p>

      <h2>2 · Your name</h2>
      <input id="nameInput" placeholder="e.g. Alex" maxlength="12" autocomplete="off">

      <h2>3 · Room code</h2>
      <input id="roomInput" placeholder="Code on the laptop screen" maxlength="6" autocomplete="off">

      <button class="join-btn" id="joinBtn" disabled>Join the game</button>
      <p class="join-error" id="joinError" hidden></p>
      <p class="hint">Open the Shared Main Screen on the laptop, then enter its room code here.</p>
    </section>

    <section class="actions" id="actionSection" hidden>
      <div class="you">
        <span class="you-icon" id="youIcon"></span>
        <div class="you-info">
          <b id="youName"></b>
          <small id="youRole"></small>
          <small id="youRoom" class="you-room"></small>
        </div>
        <button class="leave-btn" id="leaveBtn">Leave</button>
      </div>
      <p class="you-status" id="youStatus"></p>

      <h2>Your interaction</h2>
      <p class="inter-binding" id="interBinding"></p>
      <div class="stage-banner" id="stageBanner" hidden></div>
      <div class="inter-stage" id="interStage"></div>

      <div class="inter-status" id="interStatus">
        <span class="inter-dot" id="interDot"></span>
        <span id="interStatusText">Select an interaction</span>
      </div>
      <div class="inter-result" id="interResult"></div>
      <button class="inter-reset" id="interResetBtn" hidden>⟳ Try again</button>

      <h2>Manual test (dev)</h2>
      <div class="inter-select" id="interSelect">
        <button class="inter-btn" data-inter="blow">💨 Blow</button>
        <button class="inter-btn" data-inter="shake">📳 Shake</button>
        <button class="inter-btn" data-inter="press">👆 Press &amp; Hold</button>
        <button class="inter-btn" data-inter="tilt">📐 Tilt</button>
        <button class="inter-btn" data-inter="swipe">👋 Swipe</button>
      </div>
    </section>
  </main>

  <script src="../js/vendor/mqtt.min.js"></script>
  <script src="../js/vendor/p5.min.js"></script>
  <script src="../js/vendor/p5.sound.min.js"></script>
  <script src="../js/shared.js"></script>
  <script src="../js/player.js"></script>
  <script src="../js/interactions.js"></script>
</body>
</html>
