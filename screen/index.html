<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECIDER · Shared Main Screen</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/screen.css">
</head>
<body>

  <header class="topbar">
    <h1>DECIDER</h1>
    <div class="room">
      <span class="dot" id="connDot"></span>
      <span id="connText">Connecting…</span>
    </div>
    <div class="room-code">Room: <b id="roomCode">…</b></div>
    <div class="env-panel">
      <span class="env-panel-label">ENV TEST</span>
      <button class="env-btn active" data-env="sunny">☀️ Sunny</button>
      <button class="env-btn" data-env="rain">🌧️ Rain</button>
      <button class="env-btn" data-env="snow">❄️ Snow</button>
    </div>
  </header>

  <main class="stage-wrap">
    <div class="world-wrap">
      <div id="world" class="world game-area env-sunny">
        <span class="game-area-label">GAME AREA</span>
        <img id="mapBackground" class="map-background" src="../assets/room/Map.png" alt="Room background">
        <div class="sun-overlay" aria-hidden="true"></div>
        <div class="window-fx" id="windowFx" aria-hidden="true">
          <div class="window-dim"></div>
        </div>
        <canvas id="character" class="character"></canvas>
        <img id="item" class="item-layer" alt="Item or tool">
      </div>
    </div>

    <div class="result">
      <div id="resultText" class="result-text">0 / 4 READY</div>
      <div id="resultSub" class="result-sub"></div>
      <button id="nextRoundBtn" class="next-round-btn" hidden>NEXT ROUND →</button>
    </div>

    <div class="event-log">
      <span class="event-log-label">LOG</span>
      <span id="eventLogText" class="event-log-text">—</span>
    </div>
  </main>

  <footer class="players" id="players"></footer>

  <div class="test-panels">
    <div class="char-panel">
      <span class="char-panel-label">CHAR TEST</span>
      <button class="char-btn active" data-state="idle">Idle</button>
      <button class="char-btn" data-state="walk">Walk</button>
      <button class="char-btn" data-state="run">Run</button>
      <button class="char-btn" data-state="jump">Jump</button>
      <button class="char-btn" data-state="fall">Fall</button>
      <button class="char-btn" data-state="wind">Blown by Wind</button>
      <button class="char-btn" data-state="eat">Eat</button>
    </div>
    <div class="item-panel">
      <span class="item-panel-label">ITEM TEST</span>
      <button class="item-btn active" data-item="none">None</button>
      <button class="item-btn" data-item="pizza">Pizza</button>
      <button class="item-btn" data-item="football">Football</button>
      <button class="item-btn" data-item="umbrella">Umbrella</button>
      <button class="item-btn" data-item="hammer">Hammer</button>
      <button class="item-btn" data-item="flashlight">Flashlight</button>
      <button class="item-btn" data-item="phone">Phone</button>
    </div>
    <div class="dev-panel">
      <span class="dev-panel-label">DEV</span>
      <button class="dev-btn" id="devFillBtn">Fill Missing Roles</button>
    </div>
  </div>

  <script src="../js/vendor/mqtt.min.js"></script>
  <script src="../js/shared.js"></script>
  <script src="../js/screen.js"></script>
  <script src="../js/environment.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/items.js"></script>
</body>
</html>
